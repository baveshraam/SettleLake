[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settlelake"
version = "0.1.0"
description = "SettleLake: a local cross-border payments data platform (synthetic data, DuckDB + Parquet lakehouse, deterministic reconciliation)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=15",
    "pydantic>=2.6",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
settlelake = "settlelake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
settlelake = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long SQL strings; formatting is handled by ruff format

[tool.ruff.lint.per-file-ignores]
"src/settlelake/simulator/generator.py" = ["B023"]  # ev() closure is used within its own iteration

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["settlelake"]
omit = ["*/dashboard/app.py"]
